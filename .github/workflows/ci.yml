name: CI

# 手元では速い層だけを走らせる（Scripts/test.sh）。重い層と、性質テストの
# 全部の種はここで回す。
on:
  push:
    paths-ignore:
      - 'website/**'
      - '**/*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # SpeechAnalyzer を使うので macOS 26 の SDK が要る。
      - name: 一番新しい Xcode を選ぶ
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "使う Xcode: $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      # App Store に出すビルドは Sandbox が要る。Debug はテストのために外して
      # あるので、Release の設定が戻っていないことだけ見張る。
      - name: Release が Sandbox で作られること
        run: |
          xcodebuild -project Nanovid.xcodeproj -scheme Nanovid -configuration Release \
            -showBuildSettings 2>/dev/null | grep -q ' ENABLE_APP_SANDBOX = YES'

      # L() でくるんだ文言は Xcode の抽出に載らないので、機械で見張る。
      # Scripts/test.sh からも走るが、落ちた理由がすぐ分かるよう単体でも出す。
      - name: 文言カタログの検査
        run: Scripts/check-localization.py

      # 手元で毎回走るのと同じ経路。速い層だけが緑になることも見張る。
      - name: テスト（速い層だけ・手元と同じ経路）
        run: Scripts/test.sh --skip-l10n

      # TEST_RUNNER_ を付けた環境変数が、頭を外してテストのプロセスに入る。
      # xcodebuild の引数として渡すと届かず、重い層が黙って全部飛ぶ。
      # 飛んでいないことも見る（重い層のスイートが 1 つでも「飛ばした」なら落とす）。
      - name: テスト（重い層も含めて全部）
        env:
          TEST_RUNNER_NANOVID_TESTS: all
        run: |
          set -o pipefail
          xcodebuild test \
            -project Nanovid.xcodeproj \
            -scheme Nanovid \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult | tee "$RUNNER_TEMP/test.log" | tail -40
          if grep -q "重い層。Scripts/test.sh --all" "$RUNNER_TEMP/test.log"; then
            echo "重い層が飛ばされています" >&2
            exit 1
          fi

      # 描画から書き出しまで、GUI なしで通す経路。ここが一番の本番に近い。
      - name: 書き出しまで通す（--selftest）
        run: |
          set -o pipefail
          products=$(xcodebuild -project Nanovid.xcodeproj -scheme Nanovid \
            -configuration Debug -showBuildSettings \
            | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')
          "$products/Nanovid.app/Contents/MacOS/Nanovid" \
            --selftest "$RUNNER_TEMP/nanovid-selftest"

      # App Store 用ビルドは MCP をコンパイルから外す（NANOVID_APPSTORE=YES）。
      # #if の片側だけ壊れても気づけるよう、こちらの構成でもテストを通し、
      # できたアプリに MCP が残っていないことを見る。署名は要らないので外す。
      # selftest が使う成果物を作り直してしまうので、最後に置く。
      - name: App Store 用ビルドでもテストが通ること
        run: Scripts/test.sh --skip-l10n --appstore

      - name: App Store 用ビルドに MCP が入っていないこと
        run: |
          set -o pipefail
          xcodebuild -project Nanovid.xcodeproj -scheme Nanovid -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/appstore-build" build \
            NANOVID_APPSTORE=YES CODE_SIGNING_ALLOWED=NO | tail -5
          Scripts/check-no-mcp.sh \
            "$RUNNER_TEMP/appstore-build/Build/Products/Release/Nanovid.app"

      - name: 失敗したら結果を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
